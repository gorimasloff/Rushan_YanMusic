<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rushan_Yan | Музыкальный продакшн</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Плеер (Пути исправлены: без папки audio/) -->
    <div class="mini-player">
        <i class="fas fa-play-circle play-trigger" data-audio="serdce.mp3" data-title="Сердце ждет"></i>
        <span>Сердце ждет</span>
    </div>
    <div class="mini-player">
        <i class="fas fa-play-circle play-trigger" data-audio="ostatsy.mp3" data-title="Остаться"></i>
        <span>Остаться</span>
    </div>

    <!-- Галерея (Пути исправлены: без папки images/) -->
    <div class="scroller-track">
        <img src="cover1.webp" alt="Обложка">
        <img src="cover2.webp" alt="Обложка">
        <img src="cover3.webp" alt="Обложка">
    </div>

    <audio id="main-audio-engine"></audio>

    <script>
        const audio = document.getElementById('main-audio-engine');
        document.querySelectorAll('.play-trigger').forEach(trigger => {
            trigger.onclick = () => {
                const src = trigger.getAttribute('data-audio');
                if (audio.src.includes(src)) {
                    audio.paused ? audio.play() : audio.pause();
                } else {
                    audio.src = src;
                    audio.play();
                }
            };
        });
    </script>
</body>
</html>
